services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    env_file:
      - .env

  mysql:
    image: mysql:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: koda_exam
      MYSQL_USER: koda
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
